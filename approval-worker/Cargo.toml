[package]
name = "lecture-approval"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
unicode-normalization = "0.1"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
opt-level = "s"
